name: Build Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      selected_version:
        description: 'Tag to associate with current working tree. If unset, `git describe` is used.'
        type: string
        required: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install just
        run: sudo apt install -y just
      - name: Build documentation (explicit selected version)
        if: github.event_name == 'workflow_dispatch' && inputs.selected_version
        run: cd docs && just latest_version=${{ inputs.selected_version }} all
      - name: Build documentation
        if: github.event_name != 'workflow_dispatch' || !inputs.selected_version
        run: cd docs && just all
      - name: Publish production
        if: github.event_name == 'release'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: cf_publish_production
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/target/site/ --project-name=lz4-java-yawk-at --branch=main
      - name: Publish preview
        if: github.event_name != 'release'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        id: cf_publish_preview
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/target/site/ --project-name=lz4-java-yawk-at
      - name: Check PR
        if: github.event_name != 'release'
        uses: 8BitJonny/gh-get-current-pr@08e737c57a3a4eb24cec6487664b243b77eb5e36 # 3.0.0
        id: pr
      - name: Comment on PR
        if: steps.pr.outputs.pr_found
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          message: ":rocket: Preview deployed to ${{steps.cf_publish_preview.outputs.deployment-url}}"
          comment-tag: deployment
          pr-number: "${{steps.pr.outputs.number}}"
