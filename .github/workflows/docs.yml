name: Build Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      selected_version:
        description: 'Tag to associate with current working tree. If unset, `git describe` is used.'
        type: string
        required: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Temurin JDK 25
        uses: yawkat/setup-java@4fa78e3e33f61445e2aca2aee58c7d9b65bf2224 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install just
        run: sudo apt install -y just
      - name: Build documentation (explicit selected version)
        if: github.event_name == 'workflow_dispatch' && inputs.selected_version
        run: cd docs && just latest_version=${{ inputs.selected_version }} all
      - name: Build documentation
        if: github.event_name != 'workflow_dispatch' || !inputs.selected_version
        run: cd docs && just all
      - name: Publish production
        if: github.event_name == 'release'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        id: cf_publish_production
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/target/site/ --project-name=lz4-java-yawk-at --branch=main
      - name: Publish preview
        if: github.event_name != 'release'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        id: cf_publish_preview
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/target/site/ --project-name=lz4-java-yawk-at
      - name: Check PR
        if: github.event_name != 'release'
        uses: 8BitJonny/gh-get-current-pr@4056877062a1f3b624d5d4c2bedefa9cf51435c9 # 4.0.0
        id: pr
      - name: Comment on PR
        if: steps.pr.outputs.pr_found
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          message: ":rocket: Preview deployed to ${{steps.cf_publish_preview.outputs.deployment-url}}"
          comment-tag: deployment
          pr-number: "${{steps.pr.outputs.number}}"
