name: Run tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux test
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            coverage: true
            maven-flags: -Pcoverage
          - runs-on: ubuntu-24.04-arm
            # Azul Zulu 7 not available on Aarch64
            maven-flags: >-
              -Dmaven.compiler.source=8
              -Dmaven.compiler.target=8
          - runs-on: ubuntu-24.04-riscv
            # Disable fuzzing until https://github.com/CodeIntelligenceTesting/jazzer supports linux-riscv64
            maven-flags: >-
              -Dtest='!net/jpountz/fuzz/*'
              -Dit.test='!net/jpountz/fuzz/*'
              -Dmaven.compiler.source=8
              -Dmaven.compiler.target=8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Zulu JDK 7
        if: matrix.runs-on == 'ubuntu-24.04'
        uses: ./.github/actions/setup-zulu-jdk7
      - name: Setup Temurin JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build (mvn verify)
        run: |
          if [ $(uname -m) = "x86_64" ]; then
            arch_id=amd64
          else
            arch_id=$(uname -m)
          fi
          ./mvnw -B -C -ntp -V \
            -Darch.id=${arch_id} \
            -Dnative.cc=gcc \
            -Dsurefire.reportFormat=plain \
            -Dfailsafe.reportFormat=plain \
            ${{ matrix.maven-flags }} \
            verify
      - name: Check native library
        run: |
          if [ "$(uname -m)" = "x86_64" ]; then
            arch_id=amd64
          else
            arch_id=$(uname -m)
          fi
          python3 scripts/check_natives.py --targets "linux/${arch_id}" target/classes/net/jpountz/util
      # The release workflow runs scripts/check_natives.py on all platforms; make sure it still catches the CPU
      # baseline problems of the 1.13.0 natives (https://github.com/yawkat/lz4-java/issues/186)
      - name: Self-test native library check
        if: matrix.coverage
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends binutils-multiarch
          ls /usr/bin/llvm-objdump* > /dev/null 2>&1 || sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends llvm
          jar="$RUNNER_TEMP/lz4-java-1.13.0.jar"
          curl --fail --no-progress-meter --location --retry 5 --output "$jar" \
            https://repo1.maven.org/maven2/at/yawk/lz4/lz4-java/1.13.0/lz4-java-1.13.0.jar
          echo "aba573fcd8d606a38e0157ba1eb7f16db4ece58bdbf7ea6ba2c3bc17cdf07b23  $jar" | sha256sum -c -
          python3 scripts/check_natives.py \
            --expect-failing linux/amd64,linux/ppc64le,linux/riscv64,linux/s390x,windows/amd64 "$jar"
      - name: Summarize coverage
        if: matrix.coverage
        run: >-
          python3 scripts/jacoco_summary.py target/site/jacoco/jacoco.csv target/site/jacoco-java9/jacoco.csv
          >> "$GITHUB_STEP_SUMMARY"
