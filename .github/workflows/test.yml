name: Run tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux test
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            coverage: true
            maven-flags: -Pcoverage
          - runs-on: ubuntu-24.04-arm
            # Azul Zulu 7 not available on Aarch64
            maven-flags: >-
              -Dmaven.compiler.source=8
              -Dmaven.compiler.target=8
          - runs-on: ubuntu-24.04-riscv
            # Disable fuzzing until https://github.com/CodeIntelligenceTesting/jazzer supports linux-riscv64
            maven-flags: >-
              -Dtest='!net/jpountz/fuzz/*'
              -Dmaven.compiler.source=8
              -Dmaven.compiler.target=8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Zulu JDK 7
        if: matrix.runs-on == 'ubuntu-24.04'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '7'
      - name: Setup Temurin JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build (mvn verify)
        run: |
          if [ $(uname -m) = "x86_64" ]; then
            arch_id=amd64
          else
            arch_id=$(uname -m)
          fi
          ./mvnw -B -C -ntp -V \
            -Darch.id=${arch_id} \
            -Dnative.cc=gcc \
            -Dsurefire.reportFormat=plain \
            ${{ matrix.maven-flags }} \
            verify
      - name: Summarize coverage
        if: matrix.coverage
        run: |
          # Line coverage summed over all classes in the JaCoCo CSV report (columns 8 and 9: LINE_MISSED, LINE_COVERED)
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END {
              pct = 100 * covered / (missed + covered)
              color = pct >= 80 ? "brightgreen" : pct >= 60 ? "yellow" : "red"
              printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%.1f%%\",\"color\":\"%s\"}\n", pct, color > "coverage.json"
              printf "Line coverage: **%.1f%%** (%d of %d lines)\n", pct, covered, missed + covered
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage badge data
        if: matrix.coverage && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-badge
          path: coverage.json

  coverage-badge:
    name: Publish coverage badge
    needs: linux
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      # Push the badge data to the orphan badges branch
      contents: write
    steps:
      - name: Download coverage badge data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-badge
      - name: Push to badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The badges branch only ever holds a single commit, so it doesn't accumulate history
          git init -q -b badges
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Coverage for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
